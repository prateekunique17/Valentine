<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine? 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="popper-container"></div>
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="container" id="main-container">
        <h1 id="question">Will you be my Valentine? 💕</h1>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character">
        </div>

        <div class="buttons">
            <button class="btn yes-btn" id="yes-btn" onclick="handleYesClick()">Yes</button>
            <button class="btn no-btn" id="no-btn" onclick="handleNoClick()">No</button>
        </div>
        <div id="tease-toast"></div>
    </div>

    <audio id="bg-music" loop>
        <source src="indila-love-story-slowed-reverb_TxNDfU6U.mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">
        <span id="music-icon">🔇</span>
    </button>

    <script src="script.js"></script>
</body>
</html>
